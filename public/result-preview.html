<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전체 게임 시뮬레이션 · 심야 마피아</title>
  <link rel="icon" type="image/svg+xml" href="/icons/site-icon.svg?v=20261019" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=20261019" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=20261019" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/role-icons.css" />
  <link rel="stylesheet" href="/css/result-preview.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="moon" aria-hidden="true"></span><strong>심야 마피아</strong></div>
      <div class="room-badge"><span>미리보기</span><b>SIMULATION</b></div>
    </header>
    <section class="preview-console" aria-labelledby="preview-title">
      <div class="preview-console-heading">
        <div>
          <p class="eyebrow">PLAYTHROUGH / 01</p>
          <h1 id="preview-title">전체 게임 시뮬레이션</h1>
        </div>
        <p id="preview-intro">선택한 역할의 시점으로 한 게임의 모든 단계를 실제 화면과 같은 렌더러로 확인합니다.</p>
      </div>
      <div class="preview-controls" aria-label="게임 시뮬레이션 제어">
        <div class="preview-field preview-role-field"><label for="role-select">내 역할</label><select id="role-select"><option value="mafia">마피아</option><option value="cop" selected>경찰</option><option value="citizen">시민</option><option value="doctor">의사</option></select></div>
        <div class="preview-field"><label for="case-select">현재 단계</label><select id="case-select"></select></div>
        <button id="preview-previous" type="button" class="button secondary preview-button">← 이전</button>
        <button id="preview-play" type="button" class="button secondary preview-button">다시 재생</button>
        <button id="preview-next" type="button" class="button primary preview-button">다음 단계 →</button>
      </div>
      <ol id="preview-timeline" class="preview-timeline" aria-label="게임 진행 단계"></ol>
      <p id="preview-status" role="status" aria-live="polite"></p>
    </section>
    <div id="preview-container"></div>
  </main>
  <script type="module" src="/result-preview.js"></script>
</body>
</html>
