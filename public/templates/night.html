<section class="panel action-panel phase-panel">
  <p class="eyebrow" data-text="eyebrow"></p>
  <h1 data-slot="title"></h1>
  <div class="phase-alerts" data-if="alerts">
    <div
      class="announcement"
      data-if="announcement"
      data-text="announcement"
    ></div>
    <div class="private-alert" data-if="notice" data-text="notice"></div>
    <div class="result-card" data-if="investigation">
      <span>지난 조사</span><strong data-text="investigation"></strong>
    </div>
  </div>
  <p class="hint" data-if="team" data-text="team"></p>
  <section class="mafia-selections" data-if="mafiaSelections">
    <h2>마피아 선택 현황</h2>
    <div data-slot="mafiaSelections"></div>
  </section>
  <div class="target-grid" data-slot="targets"></div>
  <button
    id="night-confirm"
    class="button primary phase-confirm"
    data-if="confirm"
    data-text="confirm"
  ></button>
</section>
