<section class="panel day-panel phase-panel">
  <p class="eyebrow" data-text="eyebrow"></p>
  <h1>서로의 이야기를<br />들어보세요.</h1>
  <div class="phase-alerts" data-if="alerts">
    <div class="announcement" data-text="announcement"></div>
    <div class="result-card" data-if="investigation">
      <span>지난밤 조사 결과</span>
      <strong data-text="investigation"></strong>
    </div>
  </div>
  <h2 class="list-title" data-text="survivors"></h2>
  <ul class="player-list" data-slot="players"></ul>
  <button
    id="day-ready"
    class="button primary day-ready-button"
    data-if="alive"
    data-text="action"
  ></button>
  <p class="privacy-note" data-if="alive" data-text="progress"></p>
  <p class="waiting-copy" data-if="dead" data-text="progress"></p>
</section>
