<section
  class="panel start-panel landing-layout"
  aria-labelledby="create-title"
>
  <div class="landing-copy">
    <p class="eyebrow">새로운 사건을 시작합니다</p>
    <h1 id="create-title">오늘 밤,<br />누구를 믿을까요?</h1>
    <p class="intro">
      방을 만들고 친구들을 초대하세요. 누가 진실을 말하는지는 아무도 모릅니다.
    </p>
    <div class="case-mark" aria-hidden="true">
      <span>CASE FILE</span>
      <b>00:00</b>
    </div>
  </div>

  <div class="entry-card">
    <p class="entry-number">NEW CASE / 01</p>

    <h2 class="entry-title">새 게임 만들기</h2>
    <p class="entry-description">게임에서 사용할 이름을 입력하세요.</p>

    <label for="name">닉네임</label>
    <input
      id="name"
      maxlength="12"
      autocomplete="nickname"
      placeholder="예: 지수"
    />

    <button id="create" class="button primary" type="button">방 만들기</button>

    <button id="back" class="link-button" type="button">
      처음으로 돌아가기
    </button>

    <p class="form-note" data-text="note"></p>
  </div>
</section>
