<section class="panel vote-result-panel">
  <p class="eyebrow">낮 투표 결과</p>
  <div class="role-symbol" data-slot="icon"></div>
  <h1 data-text="title"></h1>
  <p class="intro" data-text="description"></p>
  <h2 class="list-title">참가자</h2>
  <ul class="player-list" data-slot="players"></ul>
  <button
    id="confirm-vote-result"
    class="button primary"
    data-if="alive"
    data-text="action"
  ></button>
  <p class="privacy-note" data-if="alive" data-text="progress"></p>
  <p class="waiting-copy" data-if="dead" data-text="progress"></p>
</section>
